version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: agent-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: agent_factory
    ports:
      - "5433:5432"
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"

  agent-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-runner-api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://agent:agent_password@localhost:5433/agent_factory
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROJECTS_PATH=/data/projects
      - AGENT_TOKEN=${AGENT_TOKEN:-secret-token}
    ports:
      - "7600:3000"
    volumes:
      - ./projects:/data/projects
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

volumes:
  agent_postgres_data: