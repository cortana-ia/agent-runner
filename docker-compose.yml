version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  agent-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-runner-api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROJECTS_PATH=/data/projects
      - AGENT_TOKEN=${AGENT_TOKEN:-secret-token}
    ports:
      - "3001:3000"
    volumes:
      - ./projects:/data/projects
    depends_on:
      - redis
    restart: unless-stopped